name: CI

# Keep this workflow aligned with .github/workflows/ci.yml. Forgejo jobs run in
# the Rust image configured on the Forgejo runner, so no toolchain download is
# needed here.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Forgejo injects FORGEJO_TOKEN into every job. Supply the other two provider
  # values so config-validation tests do not see a deliberately incomplete set.
  FORGEJO_BASE_URL: http://localhost:3000
  FORGEJO_WEBHOOK_SECRET: forgejo-ci-test-secret

jobs:
  check:
    name: "fmt, clippy, test"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        # The state-machine tests include sub-second concurrency deadlines.
        # Forgejo's shared runner serializes Cargo's test harness to avoid
        # starving those deadlines when the host is busy.
        run: cargo test --locked --all-targets -- --test-threads=1
