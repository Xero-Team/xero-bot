[package]
name = "xero-bot"
version = "0.2.0"
edition = "2021"
description = "Xero-Team GitHub bot: bors/triagebot-style commands, incremental AI review, CodeQL reports"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
vercel_runtime = { version = "2.4", features = ["axum"] }
octocrab = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
# Already in the tree at 2.3.2 via octocrab -> url, so this adds nothing to the
# dependency graph or the build. octocrab does not re-export it, so a direct
# dependency is the only way to reach it.
percent-encoding = "2"
futures = "0.3"
thiserror = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# vendored vercel_runtime 2.4.0: upstream compiles on unix only (std::env
# imported under #[cfg(unix)] but env::var used unconditionally). One-line
# fix; behaviour otherwise identical. See vendor/vercel_runtime/src/lib.rs.
[patch.crates-io]
vercel_runtime = { path = "vendor/vercel_runtime" }

# --- self-hosted server binary (docker / VPS) ---
[[bin]]
name = "server"
path = "src/main.rs"

# --- Vercel function entrypoints ---
[[bin]]
name = "webhook"
path = "api/webhook.rs"

[[bin]]
name = "cron"
path = "api/cron.rs"

[[bin]]
name = "health"
path = "api/health.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
