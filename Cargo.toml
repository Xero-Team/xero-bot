[package]
name = "xero-bot"
version = "0.2.0"
edition = "2021"
description = "Xero-Team GitHub bot: bors/triagebot-style commands, incremental AI review, CodeQL reports"
license = "MIT"

[lib]
name = "xero_bot"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
octocrab = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
futures = "0.3"
thiserror = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"

# --- self-hosted server binary (docker / VPS) ---
[[bin]]
name = "server"
path = "src/main.rs"

[dependencies.vercel_runtime]
version = "2.4"
features = ["axum"]

# vendored vercel_runtime 2.4.0: upstream compiles on unix only (std::env
# imported under #[cfg(unix)] but env::var used unconditionally). One-line
# fix; behaviour otherwise identical. See vendor/vercel_runtime/src/lib.rs.
[patch.crates-io]
vercel_runtime = { path = "vendor/vercel_runtime" }
