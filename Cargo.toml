[package]
name = "xero-bot"
version = "0.2.0"
edition = "2021"
description = "Xero-Team GitHub bot: bors/triagebot-style commands, incremental AI review, CodeQL reports"
license = "MIT"

[lib]
name = "xero_bot"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
octocrab = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
futures = "0.3"
thiserror = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"
