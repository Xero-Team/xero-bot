# Save as .github/xero-bot.toml on the target repository's default branch.
# Omit any entry to use its built-in default. Do not configure both an ID and
# its alias. The idle_workflows section can coexist with these sections.
# This file lists the complete built-in manual defaults and enables no
# automatic creation/path actions. Missing/empty files have the same defaults.
# See example.toml at the repository root for the annotated full reference.

[command_triggers]
claim   = { mode = "no_mention" } # take
unclaim = { mode = "no_mention" } # untake / release / release-assignment
cc      = { mode = "no_mention" }
"r?"    = { mode = "no_mention" }
ready   = { mode = "no_mention" } # ?r / reviewer
"r+"    = { mode = "always_mention" } # r= / r+ as / r+ @user
"r-"    = { mode = "always_mention" }
review  = { mode = "mention_once" }
codeql  = { mode = "mention_once" }
label   = { mode = "mention_once" } # relabel
assign  = { mode = "mention_once" }
author  = { mode = "mention_once" }
blocked = { mode = "mention_once" }
ping    = { mode = "mention_once" }
help    = { mode = "mention_once" } # commands
queue   = { mode = "mention_once" }

[command_sessions]
ttl_days = 30 # 1..365

# No event_triggers or path_triggers.rules are enabled by this file.
# Explicit opt-in examples live in examples/triggers-opt-in.toml.
# To disable a command, REPLACE its entry above with mode = "disabled".
# Never configure a canonical name and its alias together.
# Forgejo 双向协作消息桥 / Two-way collaboration bridge
# 同步 Issue/PR 元数据与评论，不复制 CI 或 review approval。
# 普通仓库需要显式双边身份绑定；旧 pull mirror 仅支持 Issue/评论。token 只放部署环境。
# 先升级 bot，再将配置镜像到 Forgejo；双方默认分支策略均须启用。
# 仅同步新建对象和已有映射；fork PR 不复制。Git refs 需双方显式启用 sync_refs。详见 docs/forgejo.md。
# 启用前需要为本仓库配置 GitHub 的 Issues / Pull request / Issue comment
# webhook，以及 Forgejo 的同名 webhook 事件。
# [forgejo.bridge]
# enabled = false
# destination = "xero-team/xero-bot"
# issues = true
# pull_requests = false # 普通仓库完成绑定后可开启
# comments = true
# github_repository = "Xero-Team/xero-bot"
# github_repository_id = 1351057454
# forgejo_repository_id = 2
# sync_refs = false # 普通仓库双方显式开启后，按快进规则同步 refs

# Forgejo 单向仓库镜像 / One-way GitHub -> Forgejo mirror
# 目标仓库必须已存在，并在 Forgejo 中配置为从本 GitHub 仓库拉取的 pull mirror。
# bot 只调用 Forgejo 的 mirror-sync，不管理 Forgejo 保存的 GitHub 拉取凭据。
# destination 必须是严格的 owner/repository；不能写 URL、token、query 或额外字段。
# 默认关闭；缺失目标时不会猜测或自动创建仓库。
# 升级所有实例后再取消注释；旧解析器拒绝未知表。
# [forgejo.mirror]
# enabled = false
# destination = "xero-team/xero-bot"
