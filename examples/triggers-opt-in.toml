# OPT-IN EXAMPLE: copying these sections to .github/xero-bot.toml on the
# default branch ENABLES automatic actions. Create the labels first and replace
# octocat with an intended personal GitHub login. Omitted manual settings keep
# their defaults. Do not disable a command referenced by an automatic rule.
# See ../example.toml for all manual/session/path settings. Copy only the rules
# you want; copying this WHOLE file enables both review and CodeQL reports.

[[event_triggers]]
id = "review-on-open"
event = "pull_request.opened"
command = "review" # PR only; COMMENT, never APPROVE or merge queue

# Optional additional report; requires existing code scanning setup/permissions.
[[event_triggers]]
id = "codeql-on-open"
event = "pull_request.opened"
command = "codeql"

[[event_triggers]]
id = "issue-triage-on-open"
event = "issues.opened"
command = "label"
add = ["needs-triage"] # existing labels; no queue / CODEQL_LABEL controls

# The same static label action is supported for PR creation, including drafts.
[[event_triggers]]
id = "pr-triage-on-open"
event = "pull_request.opened"
command = "label"
add = ["needs-triage"]

[path_triggers]
events = ["pull_request.opened", "pull_request.synchronize"]
max_cc_users_per_pr = 10 # 0..10, lifetime distinct recipients across all rules

[[path_triggers.rules]]
id = "rust-maintainers"
include = ["src/**/*.rs"]
exclude = ["src/generated/**"]
labels = ["area/rust"]
cc = ["octocat"] # explicit personal login, no @ or team / CODEOWNERS inference
# Omit labels for CC-only rules, or omit cc for labels-only rules. In a mixed
# rule all configured labels must exist, and neither label nor cc may be disabled.
# Generated files participate unless excluded above. Renames match old and new
# paths; deleted files use their old name. Incomplete diffs produce no actions.
# All rules share the lifetime budget; pushes, config changes, deleted comments
# and restarts never reset it. Excess recipients are counted, never mentioned.
